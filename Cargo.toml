[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
authors = ["Benjamin Abbitt"]
rust-version = "1.96"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false

[workspace.dependencies]
angzarr-build = { path = "crates/angzarr-build" }
angzarr-codegen = { path = "crates/angzarr-codegen" }
# angzarr core's shared crates, pinned by one full commit; bumps are
# deliberate commits, moved together with the embedded pin below.
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "f6fed5e53c1d17bf7d7c23c98a7b4a7df972a47e" }
angzarr-proto = { version = "0.1", git = "https://github.com/angzarr-io/angzarr", rev = "f6fed5e53c1d17bf7d7c23c98a7b4a7df972a47e" }
# The tests' scratch directories (std alone), a dev-dependency only.
angzarr-test-dir = { git = "https://github.com/angzarr-io/angzarr", rev = "f6fed5e53c1d17bf7d7c23c98a7b4a7df972a47e" }
# Rendering a diagnostic through its Fluent catalogs, a dev-dependency only:
# the tests hold each crate's catalog to a real Fluent formatter.
angzarr-presentation = { git = "https://github.com/angzarr-io/angzarr", rev = "f6fed5e53c1d17bf7d7c23c98a7b4a7df972a47e" }
# angzarr-embedded is pinned by full commit; bumps are deliberate commits.
angzarr-embedded-host-config = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "94f630a38f5fc79657fb09bbc73f7def27d31335" }
serde = { version = "1", features = ["derive"] }

# Every crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
# Zero-width and other invisible characters in source: never intended.
invisible_characters = "deny"
# A literal in another normalization form than NFC reads the same as its NFC
# twin and compares unequal.
unicode_not_nfc = "deny"
# Non-ASCII in a literal is written as an escape, so what the code holds is
# visible.
non_ascii_literal = "deny"
# Complexity (architecture-fixes G2; taskloom's gate), at clippy's defaults
# (cognitive complexity 25, 100 lines) except nesting, whose threshold is in
# clippy.toml. `just lint` denies warnings, and pre-commit runs it.
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
