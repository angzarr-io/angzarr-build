# The compile fixture of angzarr-build's tests/local.rs: the blackjack
# example's wire types, domain layer, adapters and register() generated from
# the spec's protos, its components the scaffold of the day (`todo!()`
# bodies), type-checked against angzarr-embedded and angzarr-router. Never
# run; a workspace of its own, outside angzarr-build's. Its Cargo.lock is a
# build artifact, ignored.
[package]
name = "blackjack-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# The family's pins, as the other fixtures': angzarr-embedded and the router
# it names, so the app has one router and one angzarr-proto.
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "e2b0ebae7b849e6437c1fc5c1e5c34819864115c" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "e2b0ebae7b849e6437c1fc5c1e5c34819864115c" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "9aa923b2f5f1d132c424d324896fce8d5be77f47" }
prost = "0.14"

[build-dependencies]
angzarr-build = { path = "../../.." }
