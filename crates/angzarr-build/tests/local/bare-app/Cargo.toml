# The compile fixture of angzarr-build's tests/local.rs: a domain with no
# events at all (the bare fixture), its wire types, domain layer, adapters
# and register() generated, its component the scaffold of the day,
# type-checked against angzarr-embedded and angzarr-router. Never run; a
# workspace of its own, outside angzarr-build's. Its Cargo.lock is a build
# artifact, ignored.
[package]
name = "bare-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# The family's pins, as the other fixtures': angzarr-embedded and the router
# it names, so the app has one router and one angzarr-proto.
[dependencies]
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "ba73fabeb8a58c48892e3417c5ab9e2dd7228740" }
angzarr-embedded-macros = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "ba73fabeb8a58c48892e3417c5ab9e2dd7228740" }
angzarr-router = { git = "https://github.com/angzarr-io/angzarr-router", rev = "bc729edcbc2cd825299e3f789df66f6e6df0c565" }
prost = "0.14"

[build-dependencies]
angzarr-build = { path = "../../.." }
