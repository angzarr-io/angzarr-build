syntax = "proto3";

// A process manager started by a fact (decision 14.69, ruling 9: the
// buy-in's StartBuyIn): its one starting input is a fact, its next a fact
// too. tests/starts.rs.
package intake.v1;

import "io/angzarr/v1/options.proto";

message IntakeState {
  option (io.angzarr.v1.component) = {
    component_name: "pmg-intake"
    process_manager: {
      domain: "intake"
      starting_types: ["intake.v1.StartIntake"]
    }
  };

  bool started = 1;
}

message StartIntake {
  option (io.angzarr.v1.fact) = {
    component: "intake.v1.IntakeState"
    emits: "intake.v1.IntakeStarted"
  };
  string id = 1;
}

message RecordArrival {
  option (io.angzarr.v1.fact) = {
    component: "intake.v1.IntakeState"
    emits: "intake.v1.Arrived"
  };
  string id = 1;
}

message IntakeStarted {
  option (io.angzarr.v1.event) = {component: "intake.v1.IntakeState"};
  string id = 1;
}

message Arrived {
  option (io.angzarr.v1.event) = {component: "intake.v1.IntakeState"};
  string id = 1;
}
