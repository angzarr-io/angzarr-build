syntax = "proto3";
package bad.v1;
import "io/angzarr/v1/options.proto";

// A refusal status on a message no command refuses with: generation fails.
message ThingState {
  option (io.angzarr.v1.component) = {
    component_name: "things"
    aggregate: {domain: "things"}
  };
}

message Poke {
  option (io.angzarr.v1.command) = {
    component: "bad.v1.ThingState"
    emits: ["bad.v1.Poked"]
  };
}

message Poked {
  option (io.angzarr.v1.event) = {component: "bad.v1.ThingState"};
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_NOT_FOUND;
}
