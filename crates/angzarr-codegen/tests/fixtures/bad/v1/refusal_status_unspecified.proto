syntax = "proto3";
package bad.v1;
import "io/angzarr/v1/options.proto";

// A refusal message declaring no status, or REFUSAL_STATUS_UNSPECIFIED:
// generation fails.
message ThingState {
  option (io.angzarr.v1.component) = {
    component_name: "things"
    aggregate: {domain: "things"}
  };
}

message Poke {
  option (io.angzarr.v1.command) = {
    component: "bad.v1.ThingState"
    emits: ["bad.v1.Poked"]
    refuses: ["bad.v1.PokeRefused"]
  };
}

message Poked {
  option (io.angzarr.v1.event) = {component: "bad.v1.ThingState"};
}

message PokeRefused {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_UNSPECIFIED;
}
